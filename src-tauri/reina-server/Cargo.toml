[package]
name = "reina-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reina-core = { path = "../reina-core" }
axum = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs"] }
sea-orm = { version = "2.0.2", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonwebtoken = "9.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
log = "0.4.33"
env_logger = "0.11"
sha2 = "0.11.0"
url = "2.5.8"
thiserror = "2"
futures-util = "0.3"
httpdate = "1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
# 任務 8 的節流器測試用 #[tokio::test(start_paused = true)] 快轉時間
tokio = { version = "1.53.1", features = ["test-util"] }
